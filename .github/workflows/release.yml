name: Build, release, and deploy font

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create or update GitHub Release for package.json version"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
      - name: Build and validate fonts
        run: python3 src/build_font.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hangry-grotesk-${{ github.run_id }}
          path: dist/
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/HangryGrotesk*.zip --clobber
          else
            gh release create "${TAG_NAME}" dist/HangryGrotesk*.zip --title "Hangry Grotesk ${TAG_NAME}" --generate-notes
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: hangry-grotesk-${{ github.run_id }}
          path: dist
      - name: Prepare preview site
        run: |
          mkdir -p site/fonts
          cp dist/preview.html site/index.html
          cp dist/hangrygrotesk.css site/hangrygrotesk.css
          cp -R dist/fonts/. site/fonts/
          cp dist/HangryGrotesk*.zip site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4
