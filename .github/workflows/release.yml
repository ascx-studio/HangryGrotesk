name: Build, release, and deploy font

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --no-save
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Check and build fonts
        run: |
          bun run check
          bun run build
      - name: Package npm tarball
        run: npm pack --ignore-scripts --pack-destination dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hangry-grotesk-${{ github.run_id }}
          path: dist/
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/HangryGrotesk-*.zip dist/hangrygrotesk-*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/HangryGrotesk-*.zip dist/hangrygrotesk-*.tgz --title "Hangry Grotesk ${GITHUB_REF_NAME}" --generate-notes
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: hangry-grotesk-${{ github.run_id }}
          path: dist
      - name: Prepare preview site
        run: |
          mkdir -p site/fonts
          cp dist/preview.html site/index.html
          cp dist/hangrygrotesk.css site/hangrygrotesk.css
          cp -R dist/fonts/. site/fonts/
          cp dist/HangryGrotesk-*.zip site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4
