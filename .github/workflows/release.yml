name: Build and release font

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --no-save
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Check and build fonts
        run: |
          bun run check
          bun run build
      - name: Package npm tarball
        run: npm pack --ignore-scripts --pack-destination dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hangry-grotesk-${{ github.ref_name }}
          path: |
            dist/HangryGrotesk-*.zip
            dist/hangrygrotesk-*.tgz
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/HangryGrotesk-*.zip
          dist/hangrygrotesk-*.tgz
          --title "Hangry Grotesk ${GITHUB_REF_NAME}"
          --generate-notes
